<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>렌터카 업무 플로우 V10 - 원본 카톡 표시</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#fff;--text:#18212f;--muted:#6c7787;--line:#dfe5ec;
  --primary:#1565c0;--primary2:#0d47a1;--soft:#eaf3ff;--ok:#16835a;--warn:#b66a00;--danger:#c23a3a;
  --shadow:0 10px 30px rgba(20,42,74,.08);--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.sidebar{background:#10233f;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:20px;padding:8px 10px 22px}
.brand small{display:block;font-size:11px;font-weight:500;color:#9fb1c8;margin-top:4px}
.nav button{width:100%;border:0;background:transparent;color:#cbd6e5;text-align:left;padding:12px 13px;border-radius:11px;margin:3px 0}
.nav button:hover,.nav button.active{background:#1b3b66;color:#fff}
.side-note{position:absolute;left:16px;right:16px;bottom:18px;background:#173052;border:1px solid #29466a;padding:12px;border-radius:12px;font-size:11px;color:#bfcadd;line-height:1.55}
.main{min-width:0}
.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.top-title{font-weight:800}
.manager{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.manager input{width:170px}
.content{padding:26px;max-width:1480px;margin:auto}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:18px}.grid.cols-3{grid-template-columns:repeat(3,1fr)}.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2,.card h3{margin:0 0 14px}.card h2{font-size:20px}.card h3{font-size:16px}
.kpi{padding:20px}.kpi .label{color:var(--muted);font-size:13px}.kpi .value{font-size:30px;font-weight:800;margin-top:8px}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#eef3f8;font-size:11px;font-weight:700}
.badge.blue{background:#e5f0ff;color:#1259a8}.badge.green{background:#e5f7ef;color:#126b4b}.badge.orange{background:#fff3dd;color:#9a5a00}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#536070}
input,select,textarea{width:100%;border:1px solid #cfd8e3;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:#69a7e9;box-shadow:0 0 0 3px #eaf3ff}
textarea{min-height:88px;resize:vertical}
.field.span2{grid-column:span 2}.field.span3{grid-column:span 3}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid #cfd8e3;background:#fff;border-radius:10px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}
.btn.soft{background:var(--soft);border-color:#cfe4ff;color:#155aa8}
.btn.success{background:#157a56;border-color:#157a56;color:#fff}
.btn.danger{background:#fff4f4;border-color:#f0c2c2;color:#b52d2d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.notice{padding:13px 15px;border-radius:12px;background:#f7f9fc;border:1px solid var(--line);font-size:13px;line-height:1.55}
.notice.blue{background:#edf5ff;border-color:#cfe4ff}.notice.warn{background:#fff8eb;border-color:#f3dba8}.notice.ok{background:#edf9f4;border-color:#c6eadb}
.progress{display:flex;gap:5px;margin:6px 0 20px;overflow:auto}
.progress span{white-space:nowrap;padding:8px 10px;border-radius:9px;background:#eef2f6;color:#7b8795;font-size:11px;font-weight:700}
.progress span.done{background:#e6f6ef;color:#167451}.progress span.current{background:#e5f0ff;color:#1259a8}
.script{background:#0f1e31;color:#eef5ff;border-radius:14px;padding:15px;white-space:pre-wrap;line-height:1.65;font-family:inherit;font-size:13px}
.step-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}
.stepbox{border-left:4px solid #dce7f3;padding-left:16px;margin:16px 0}.stepbox.current{border-left-color:var(--primary)}
.stepbox h3{margin-bottom:8px}.rightbox{position:sticky;top:96px;align-self:start}
.case-line{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed #e4e9ef;font-size:13px}
.case-line:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid #e6ebf1;padding:9px 8px;text-align:left;vertical-align:top}
th{background:#f7f9fc;color:#526071;position:sticky;top:0}
.table-wrap{overflow:auto;max-height:590px;border:1px solid var(--line);border-radius:12px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.toolbar .search{max-width:360px}
.center-tabs{display:flex;gap:8px;flex-wrap:wrap}.center-tabs button{padding:9px 13px;border:1px solid #ccd6e1;background:#fff;border-radius:9px}.center-tabs button.active{background:#173e6d;color:#fff;border-color:#173e6d}
.empty{padding:32px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(12,24,40,.42);display:none;align-items:center;justify-content:center;z-index:100}.modal.open{display:flex}
.modalbox{background:#fff;border-radius:18px;width:min(900px,92vw);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.2)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pricehint{margin-top:8px;padding:10px;border-radius:10px;background:#f6f9fd;font-size:12px}
.incoming-wrap{border:2px solid #b9d8ff;background:linear-gradient(180deg,#f7fbff,#fff);border-radius:16px;padding:18px;margin-top:16px}
.incoming-wrap textarea{min-height:210px;font-size:14px;line-height:1.65;background:#fff}
.parse-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.parse-head h3{margin:0}.parse-result{margin-top:12px}.parse-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.parse-chip{display:inline-flex;gap:5px;align-items:center;background:#eef5ff;color:#174f8d;border:1px solid #d5e7fb;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}
.parse-chip.missing{background:#fff3f3;color:#ae3232;border-color:#f1cccc}
.auto-field{background:#fbfdff}.source-address{background:#f6f8fb;color:#526071}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-note{display:none}.step-layout{grid-template-columns:1fr}.rightbox{position:static}.grid.cols-3,.grid.cols-2,.form-grid{grid-template-columns:1fr}.field.span2,.field.span3{grid-column:span 1}}

/* V3 workflow usability */
.workflow-sticky{position:sticky;top:74px;z-index:9;background:rgba(244,247,251,.96);backdrop-filter:blur(8px);padding:10px 0 12px;margin:-8px 0 14px;border-bottom:1px solid #e4e9f0}
.workflow-sticky .progress{display:flex;gap:6px;margin:0;overflow:auto;padding:2px 1px}
.workflow-sticky .progress span{white-space:nowrap;padding:9px 11px;border-radius:9px;background:#eef2f6;color:#7b8795;font-size:11px;font-weight:700;border:1px solid transparent}
.workflow-sticky .progress span.done{background:#e6f6ef;color:#167451;border-color:#cbe9dc}
.workflow-sticky .progress span.current{background:#e5f0ff;color:#1259a8;border-color:#bcd8f7;box-shadow:0 3px 10px rgba(21,101,192,.12)}
.step-layout{grid-template-columns:minmax(0,1fr) 360px}
.workflow-stack{display:grid;gap:14px}
.workflow-stack .stepbox{background:#fff;border:1px solid #dfe5ec;border-left:5px solid #dce7f3;border-radius:16px;padding:18px;margin:0;box-shadow:0 6px 18px rgba(20,42,74,.05)}
.workflow-stack .stepbox.current{border-left-color:var(--primary);border-top-color:#bcd8f7;border-right-color:#bcd8f7;border-bottom-color:#bcd8f7;box-shadow:0 8px 24px rgba(21,101,192,.10)}
.workflow-stack .stepbox h3{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.rightbox{top:154px}
.vehicle-hero{background:linear-gradient(135deg,#10233f,#1c4b7e);color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.vehicle-hero .vehicle-no{font-size:24px;font-weight:900;letter-spacing:.2px}
.vehicle-hero .vehicle-model{font-size:14px;color:#d7e5f5;margin-top:4px}
.vehicle-hero .center-name{font-size:11px;color:#9fc2e9;margin-top:10px}
.reply-input{min-height:145px;font-size:14px;line-height:1.65;background:#fffefb;border-color:#e6d6b8}
.reply-analysis{margin-top:12px;border:1px solid #cfe4ff;background:#f3f8ff;border-radius:12px;padding:12px}
@media(max-width:1000px){.workflow-sticky{top:0}.rightbox{top:auto}}


/* V4 alert-talk compact UI */
.alerttalk-box{width:54%;min-width:520px;max-width:720px;justify-self:start}
.alert-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.alert-meta-card{border:1px solid #cfdceb;background:#f8fbff;border-radius:12px;padding:12px}
.alert-meta-card .meta-label{font-size:11px;font-weight:800;color:#5f6e80;margin-bottom:7px}
.alert-meta-card .meta-value{font-size:12px;font-weight:800;line-height:1.45;word-break:keep-all}
.alert-meta-card .btn{margin-top:9px;padding:7px 10px;font-size:11px}
.alert-content-panel{border:1px solid #dfe5ec;border-radius:12px;overflow:hidden;background:#fff}
.alert-content-title{padding:10px 12px;background:#f4f7fb;border-bottom:1px solid #dfe5ec;font-size:12px;font-weight:900;color:#45556a}
.copy-row{display:grid;grid-template-columns:82px minmax(0,1fr) 62px;gap:9px;align-items:center;padding:8px 10px;border-bottom:1px solid #edf1f5;font-size:12px}
.copy-row:last-child{border-bottom:0}
.copy-row .copy-label{font-weight:700;color:#5b697a}
.copy-row .copy-value{font-weight:800;word-break:break-all}
.copy-row .btn{padding:6px 8px;font-size:11px}
.alert-checklist{margin-top:12px;border-radius:12px;padding:11px 12px;border:1px solid #dfe5ec;background:#f8fafc}
.alert-checklist.ok{background:#eefaf5;border-color:#c6eadb}
.alert-checklist.warn{background:#fff8eb;border-color:#f0d49b}
.alert-checklist-title{font-size:12px;font-weight:900;margin-bottom:7px}
.alert-check-item{font-size:11px;line-height:1.7}
.folder-edit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:end;margin-top:10px}
.folder-edit .field{margin:0}
@media(max-width:1150px){.alerttalk-box{width:70%;min-width:0}}
@media(max-width:1000px){.alerttalk-box{width:100%;max-width:none}.alert-meta-grid{grid-template-columns:1fr}.copy-row{grid-template-columns:72px minmax(0,1fr) 58px}}

/* V5 shop + status workspace */
.shop-contact-card{border:1px solid #cfe0f3;background:#f5f9ff;border-radius:12px;padding:12px 13px;margin:12px 0}
.shop-contact-card .shop-title{font-size:12px;font-weight:900;color:#244c79;margin-bottom:8px}
.shop-contact-row{display:grid;grid-template-columns:70px minmax(0,1fr) 58px;gap:8px;align-items:center;padding:6px 0;font-size:12px}
.shop-contact-row+.shop-contact-row{border-top:1px dashed #d9e4ef}
.shop-contact-row .key{color:#617083;font-weight:700}.shop-contact-row .val{font-weight:900;word-break:keep-all}
.bucket-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.bucket-tab{border:1px solid #d7e0ea;background:#fff;border-radius:14px;padding:13px 15px}
.bucket-tab .count{font-size:24px;font-weight:900;margin-top:5px}.bucket-tab .caption{font-size:11px;color:var(--muted)}
.status-pending{background:#fff4dd;color:#945600}.status-done{background:#e5f7ef;color:#126b4b}
.recent-actions{display:flex;gap:6px;flex-wrap:wrap}.recent-actions .btn{padding:6px 9px;font-size:11px}
.completion-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;margin-top:14px}
.completion-side{background:#f8fafc;border:1px solid #e0e6ee;border-radius:14px;padding:14px}
@media(max-width:1000px){.bucket-tabs{grid-template-columns:1fr}.completion-grid{grid-template-columns:1fr}.shop-contact-row{grid-template-columns:64px minmax(0,1fr) 54px}}

/* V6 backup / restore / trash */
.backup-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.backup-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.backup-list{display:grid;gap:9px;margin-top:12px}
.backup-item{border:1px solid #dfe5ec;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff}
.backup-item .meta{min-width:0}.backup-item .meta b{display:block}.backup-item .meta span{font-size:11px;color:var(--muted)}
.restore-preview{border:1px solid #bfd8f4;background:#f3f8ff;border-radius:13px;padding:14px;margin-top:12px}
.restore-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.restore-stat{background:#fff;border:1px solid #dbe7f3;border-radius:10px;padding:10px;text-align:center}.restore-stat b{display:block;font-size:20px}
.trash-row{opacity:.94}
.file-btn{display:inline-flex;align-items:center;gap:7px}
@media(max-width:1000px){.backup-grid{grid-template-columns:1fr}.restore-stats{grid-template-columns:repeat(2,1fr)}}


/* V9 center-first intake + implicit special-note extraction */
.center-first-wrap{display:grid;gap:16px}
.center-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.center-choice{border:2px solid #dbe4ee;background:#fff;border-radius:16px;padding:18px;text-align:left;transition:.15s;box-shadow:0 6px 18px rgba(20,42,74,.05)}
.center-choice:hover{border-color:#8dbdec;transform:translateY(-1px);box-shadow:0 10px 24px rgba(21,101,192,.10)}
.center-choice .ct-name{font-size:18px;font-weight:900;color:#163a63}
.center-choice .ct-shop{font-size:13px;font-weight:800;color:#1565c0;margin-top:8px}
.center-choice .ct-phone{font-size:15px;font-weight:900;margin-top:5px}
.center-choice .ct-address{font-size:11px;color:#687587;line-height:1.5;margin-top:6px}
.selected-center-banner{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:linear-gradient(135deg,#10233f,#1d4f84);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:16px}
.selected-center-banner .title{font-size:18px;font-weight:900}
.selected-center-banner .sub{font-size:12px;color:#c9ddf4;margin-top:5px;line-height:1.55}
.selected-center-banner .btn{background:#fff;color:#153c67;border-color:#fff}
.center-lock-note{margin-top:10px;padding:10px 12px;border-radius:11px;background:#edf7ff;border:1px solid #c9e4fa;font-size:12px;color:#24577d}
.center-mismatch{margin-top:10px;padding:11px 12px;border-radius:11px;background:#fff2f2;border:1px solid #efc5c5;color:#a52e2e;font-size:12px;line-height:1.55}
@media(max-width:1000px){.center-choice-grid{grid-template-columns:1fr}.selected-center-banner{grid-template-columns:1fr}}

/* V10 original Kakao message panel */
.raw-kakao-section{margin-top:16px;border-top:2px solid #dfe6ee;padding-top:16px}
.raw-kakao-card{border:1px solid #cfd9e5;background:#f8fafc;border-radius:13px;overflow:hidden}
.raw-kakao-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#eef3f8;border-bottom:1px solid #d7e0e9}
.raw-kakao-head b{font-size:13px;color:#183a5d}
.raw-kakao-body{padding:12px;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.7;color:#263746;max-height:300px;overflow:auto;background:#fff}
.raw-kakao-empty{padding:14px;color:#8a97a5;font-size:12px;background:#fff}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">렌터카 업무지원<small>SK렌터카 업무 플로우 V10 · 원본 카톡 표시</small></div>
    <div class="nav">
      <button class="active" data-view="dashboard">🏠 업무현황</button>
      <button data-view="newcase">➕ 신규접수</button>
      <button data-view="activecases">⏳ 처리중</button>
      <button data-view="completion">📥 완료 대기</button>
      <button data-view="completedcases">✅ 작업완료</button>
      <button data-view="recent">🕘 최근 작업</button>
      <button data-view="history">🔎 과거작업</button>
      <button data-view="master">🧾 차종·부품·단가</button>
      <button data-view="backup">💾 백업 · 복원</button>
      <button data-view="trash">🗑️ 휴지통</button>
      <button data-view="settings">⚙️ 기준정보 관리</button>
    </div>
    <div class="side-note">V10 시제품입니다.<br><b>먼저 SK렌터카 물류센터를 선택한 뒤</b> 접수 카톡을 붙여넣습니다. 카톡 내용이 센터를 임의로 바꾸지 않으며, 선택한 센터의 주소·가맹점 정보가 업무 전체에 고정 적용됩니다.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="top-title">SK렌터카 장애처리 업무</div>
      <div class="manager"><b>현재 담당 매니저</b><input id="managerName" placeholder="예: 이현경 매니저"></div>
    </div>
    <div class="content">
      <section id="dashboard" class="view active"></section>
      <section id="newcase" class="view"></section>
      <section id="activecases" class="view"></section>
      <section id="completion" class="view"></section>
      <section id="completedcases" class="view"></section>
      <section id="recent" class="view"></section>
      <section id="history" class="view"></section>
      <section id="master" class="view"></section>
      <section id="backup" class="view"></section>
      <section id="trash" class="view"></section>
      <section id="settings" class="view"></section>
    </div>
  </main>
</div>

function scheduleText(c){
  if(c.shopReplyType==='today') return '금일 방문하여 조치예정입니다.';
  if(c.shopReplyType==='datetime' && c.promiseDate){
    const d=new Date(c.promiseDate+'T00:00:00');
    const m=d.getMonth()+1, day=d.getDate();
    let t='';
    if(c.promiseTime){
      let [hh,mm]=c.promiseTime.split(':').map(Number); let ap=hh<12?'오전':'오후'; let h=hh%12||12;
      t=` ${ap} ${h}시${mm?` ${mm}분`:''}`;
    }
    return `~${m}월 ${day}일${t}까지 조치 예정입니다.`;
  }
  if(c.shopReplyType==='unavailable') return '시공점 일정 확인이 필요합니다.';
  if(c.shopReplyType==='replace') return '복원 불가로 교체 진행 확인이 필요합니다.';
  return '';
}

function cleanIncomingText(raw){
  return String(raw||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').trim();
}
function extractLabeledLine(raw,label){
  const lines=cleanIncomingText(raw).split('\n');
  const re=new RegExp('^\\s*'+label+'\\s*[:：]\\s*(.*?)\\s*$','i');
  for(const line of lines){const m=line.match(re);if(m)return m[1].trim()}
  return '';
}
function extractLabeledSection(raw,label){
  const lines=cleanIncomingText(raw).split('\n');
  const startRe=new RegExp('^\\s*'+label+'\\s*[:：]\\s*(.*)$','i');
  const other=/^\s*(차량번호|차종|주소|차대번호|VIN|특이사항|시공내용|작업내용|파손부위|담당자연락처|담당자 연락처|연락처|전화번호)\s*[:：]/i;
  let found=false,out=[];
  for(const line of lines){
    if(!found){const m=line.match(startRe);if(m){found=true;if(m[1].trim())out.push(m[1].trim())}continue}
    if(other.test(line))break;
    if(line.trim())out.push(line.trim());
  }
  return out.join('\n').trim();
}
function extractImplicitSpecial(raw){
  const lines=cleanIncomingText(raw).split('\n').map(x=>x.trim()).filter(Boolean);
  const labeled=/^(차량번호|차종|주소|차대번호|VIN|특이사항|시공내용|작업내용|파손부위|담당자연락처|담당자 연락처|연락처|전화번호)\s*[:：]/i;
  const boilerplate=/^(안녕하세요[.!~ㅎㅎㅋ ]*|감사합니다[.!~ㅎㅎㅋ ]*|수고하십니다[.!~ㅎㅎㅋ ]*|확인 부탁드립니다[.!~ㅎㅎㅋ ]*|복원가능여부 및 일정 확인 부탁드리겠습니다[.!~ㅎㅎㅋ ]*)$/i;
  const meaningful=/(출고|출발|입고|오늘|금일|내일|익일|작업|조치|처리|완료|가능|불가|시간|일정|요청|부탁|현장|키|보관|긴급|재조율|방문|시공)/;
  const out=[];
  for(const line of lines){
    if(labeled.test(line))continue;
    if(boilerplate.test(line))continue;
    if(meaningful.test(line))out.push(line);
  }
  return [...new Set(out)].join('\n').trim();
}
function localISODate(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function inferCenterFromMessage(raw,address){
  const t=(cleanIncomingText(raw)+' '+(address||'')).replace(/\s/g,'').toLowerCase();
  const rules=[
    ['ilsan',['일산물류센터','정발산로38','이스턴시티']],
    ['icheon',['이천물류센터','대월면대평로593']],
    ['daegu',['대구물류센터','신서동517-1','대구수성점']]
  ];
  for(const [id,keys] of rules){if(keys.some(k=>t.includes(k.replace(/\s/g,'').toLowerCase())))return id}
  for(const c of state.centers){
    const names=[c.name,c.fullName,c.address].filter(Boolean).map(x=>String(x).replace(/\s/g,'').toLowerCase());
    if(names.some(n=>n&&t.includes(n)))return c.id;
  }
  return '';
}
function inferWorkTypeFromMessage(raw){
  const t=cleanIncomingText(raw).replace(/\s/g,'');
  if(/후면유리?재부착|후면.*재부착|재부착/.test(t))return '후면유리재부착';
  if(/전면유리?교체/.test(t)&&/썬팅/.test(t))return '전면유리교체 및 썬팅';
  if(/측면유리?교체|측면.*교체/.test(t))return '측면유리교체';
  if(/후면유리?교체|후면.*교체/.test(t))return '후면유리교체';
  if(/전면유리?교체|전면.*교체/.test(t))return '전면유리교체';
  if(/복원/.test(t))return '유리복원';
  return state.workTypes[0]||'유리복원';
}
function parseDepartureFromMessage(raw,special,referenceISO){
  const text=(special||'')+'\n'+cleanIncomingText(raw);
  // '내일 출고차량', '익일 출고차량', '출고 예정', '출발 예정' 등 실제 카톡 표현을 폭넓게 인식
  const related=/(?:출고|출발)\s*(?:예정|예정차량|차량|일정)|(?:출고|출발)차량|완료가능\s*시간|(?:익일|내일).{0,20}(?:출고|출발)|(?:출고|출발).{0,20}(?:익일|내일)/s.test(text);
  let departureYn=related?'있음':'없음', date='',time='';
  const ref=new Date((referenceISO||nowISO())+'T12:00:00');
  const md=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(md){
    const d=new Date(ref.getFullYear(),Number(md[1])-1,Number(md[2]),12);date=localISODate(d);
  }else if(/익일|내일/.test(text)){
    const d=new Date(ref);d.setDate(d.getDate()+1);date=localISODate(d);
  }else{
    const dm=text.match(/\(?\s*(\d{1,2})\s*일\s*\)?/);
    if(dm&&related){
      const day=Number(dm[1]);let y=ref.getFullYear(),m=ref.getMonth();
      if(day<ref.getDate()-20)m+=1; else if(day>ref.getDate()+20)m-=1;
      const d=new Date(y,m,day,12);date=localISODate(d);
    }
  }
  const tm=text.match(/(오전|오후)?\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);
  if(tm&&related){
    let h=Number(tm[2]),min=Number(tm[3]||0);
    if(tm[1]==='오후'&&h<12)h+=12;if(tm[1]==='오전'&&h===12)h=0;
    if(h>=0&&h<24&&min>=0&&min<60)time=`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
  }
  return {departureYn,date,time};
}
function parseSKKakaoMessage(raw,referenceISO,selectedCenterId){
  raw=cleanIncomingText(raw);
  const vehicleNo=extractLabeledLine(raw,'차량번호');

  const address=extractLabeledLine(raw,'주소');
  const vin=extractLabeledLine(raw,'차대번호')||extractLabeledLine(raw,'VIN');

  const implicitSpecial=extractImplicitSpecial(raw);
  const special=explicitSpecial || implicitSpecial;
  const detectedCenterId=inferCenterFromMessage(raw,address);
  const centerId=selectedCenterId||state.newCaseCenterId||'';
  const workType=inferWorkTypeFromMessage(raw);

}

function parseIncomingMessage(){
  const raw=$('#nc_raw').value.trim();
  const company=companyById(state.newCaseCompanyId||'sk');
  if(!state.newCaseCompanyId){toast('먼저 렌터카 회사를 선택해 주세요');return}
  if(company.id==='sk' && !state.newCaseCenterId){toast('먼저 어느 물류센터 업무인지 선택해 주세요');return}
  if(!raw){toast('카톡 내용을 먼저 붙여넣으세요');return}
  if(company.id==='sk'){
    const p=parseSKKakaoMessage(raw,$('#nc_referenceDate').value||nowISO(),state.newCaseCenterId);
    $('#nc_center').value=state.newCaseCenterId;
    $('#nc_vehicle').value=p.vehicleNo||'';
    $('#nc_model').value=p.carModel||'';
    $('#nc_vin').value=p.vin||'';
    if(state.workTypes.includes(p.workType))$('#nc_work').value=p.workType;
    $('#nc_special').value=p.special||'';
    $('#nc_departure').value=p.departureYn||'없음';
    $('#nc_depdate').value=p.departureDate||'';
    $('#nc_deptime').value=p.departureTime||'';
    $('#nc_sourceAddress').value=p.address||'';
    refreshPriceHints();renderParseResult(p);
    if(!p.vehicleNo||!p.carModel)toast('차량번호 또는 차종을 확인해주세요');else toast(`${centerById(state.newCaseCenterId)?.name||company.name} 업무로 카톡 내용을 추출했습니다`);
  } else {
    const p=parseGenericRentalMessage(raw,$('#nc_referenceDate').value||nowISO(),company.id);
    $('#nc_vehicle').value=p.vehicleNo||'';
    $('#nc_model').value=p.carModel||'';
    $('#nc_vin').value=p.vin||'';
    if(state.workTypes.includes(p.workType))$('#nc_work').value=p.workType;
    $('#nc_special').value=p.special||'';
    $('#nc_departure').value=p.departureYn||'없음';
    $('#nc_depdate').value=p.departureDate||'';
    $('#nc_deptime').value=p.departureTime||'';
    $('#nc_sourceAddress').value=p.address||'';
    if($('#nc_manualAddress') && !$('#nc_manualAddress').value) $('#nc_manualAddress').value=p.address||'';
    if($('#nc_rentalContact')) $('#nc_rentalContact').value=p.rentalContact||'';
    refreshPriceHints();renderGenericParseResult(p);
    if(!p.vehicleNo||!p.carModel)toast('차량번호 또는 차종을 확인해주세요');else toast(`${company.name} 업무로 카톡 내용을 추출했습니다`);
  }

function setStage(id,n){let c=getCase(id);if(!c)return;c.stage=Math.max(c.stage,n);save();render('newcase')}
function parseShopReplyMessage(raw,c){
  const text=cleanIncomingText(raw);
  const refISO=(c&&c.referenceDate)||nowISO();
  const ref=new Date(refISO+'T12:00:00');
  let type='',date='',time='',summary='';

  if(/복원(?:은|이|이건|작업)?\s*(불가|어렵|힘들)|교체(?:로|가)?\s*(진행|해야|필요)/.test(text)){
    return {type:'replace',date:'',time:'',summary:'복원 불가 또는 교체 필요 내용으로 판단'};
  }
  if(/처리(?:가|는)?\s*(불가|어렵|힘들)|진행(?:이|은)?\s*(불가|어렵|힘들)|일정(?:이|은)?\s*(불가|어렵|힘들)/.test(text)){
    return {type:'unavailable',date:'',time:'',summary:'시공점 처리 불가/일정 확인 필요로 판단'};
  }

  const hasToday=/오늘|금일/.test(text);
  const hasTomorrow=/내일|익일/.test(text);
  const md=text.match(/(\d{1,2})\s*[월\/.\-]\s*(\d{1,2})\s*일?/);
  const dayOnly=text.match(/(?:^|[^0-9])(\d{1,2})\s*일(?:까지|\s|$)/);
  if(md){
    let y=ref.getFullYear(),m=Number(md[1])-1,d=Number(md[2]);
    let cand=new Date(y,m,d,12);
    if(cand.getTime()<ref.getTime()-1000*60*60*24*180)cand=new Date(y+1,m,d,12);
    date=localISODate(cand);
  }else if(hasTomorrow){
    const d=new Date(ref);d.setDate(d.getDate()+1);date=localISODate(d);
  }else if(hasToday){
    date=localISODate(ref);
  }else if(dayOnly){
    const day=Number(dayOnly[1]);let y=ref.getFullYear(),m=ref.getMonth();
    if(day<ref.getDate()-20)m+=1; else if(day>ref.getDate()+20)m-=1;
    date=localISODate(new Date(y,m,day,12));
  }

  const tm=text.match(/(오전|오후|아침|저녁|밤)?\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);
  if(tm){
    let h=Number(tm[2]),min=Number(tm[3]||0),period=tm[1]||'';
    if((period==='오후'||period==='저녁'||period==='밤')&&h<12)h+=12;
    if((period==='오전'||period==='아침')&&h===12)h=0;
    if(h>=0&&h<24&&min>=0&&min<60)time=`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
  }

  if(hasToday&&!time){type='today';date='';summary='금일 처리로 판단';}
  else if(date||time){
    if(!date)date=localISODate(ref);
    type='datetime';
    summary=`${date}${time?' '+time:''}까지 조치 예정으로 판단`;
  }else if(/할게요|하겠습니다|처리|조치|방문|가능/.test(text)){
    type='today';summary='별도 날짜가 없어 금일 처리로 우선 판단';
  }
  return {type,date,time,summary};
}

  if(!raw){toast(`${c.shop} 답변 카톡을 붙여넣으세요`);return}

function filterCompletion(){

}

function backupPayload(){

    app:'SK렌터카 업무지원',version:'V6',exportedAt:new Date().toISOString(),
    manager:state.manager||'',centers:JSON.parse(JSON.stringify(state.centers||[])),

function createAutoBackup(reason='자동백업'){
  try{
    const list=LS.get('sk_auto_backups',[]);
    const b={id:'ab'+Date.now(),createdAt:new Date().toISOString(),reason,data:backupPayload()};
    list.unshift(b);LS.set('sk_auto_backups',list.slice(0,10));
  }catch(e){console.warn('자동백업 실패',e)}
}
function downloadBackup(){
  const data=backupPayload(), now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`SK렌터카_업무백업_${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('백업 파일을 만들었습니다');
}

function formatDateTime(v){if(!v)return '-';try{return new Date(v).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return v}}
function purgeExpiredTrash(){
  const list=state?.trash||LS.get('sk_trash',[]), now=Date.now(), max=30*24*60*60*1000;const kept=list.filter(x=>!x.deletedAt||(now-new Date(x.deletedAt).getTime())<max);
  if(state)state.trash=kept;LS.set('sk_trash',kept);
}
function restoreTrashCase(id){const idx=(state.trash||[]).findIndex(x=>x.id===id);if(idx<0)return;createAutoBackup('휴지통 복원 전');const c=state.trash.splice(idx,1)[0];delete c.deletedAt;state.cases.unshift(c);save();renderTrash();toast('최근 작업으로 복원했습니다')}
function permanentDeleteTrash(id){const c=(state.trash||[]).find(x=>x.id===id);if(!c)return;if(!confirm(`NO.${c.no} ${c.vehicleNo}을 완전삭제할까요? 이 작업은 되돌릴 수 없습니다.`))return;createAutoBackup('휴지통 완전삭제 전');state.trash=state.trash.filter(x=>x.id!==id);save();renderTrash();toast('완전삭제했습니다')}
function emptyTrash(){if(!(state.trash||[]).length)return;if(!confirm('휴지통의 모든 작업을 완전삭제할까요?'))return;createAutoBackup('휴지통 비우기 전');state.trash=[];save();renderTrash();toast('휴지통을 비웠습니다')}
function renderBackup(){
  const autos=LS.get('sk_auto_backups',[]);
  $('#backup').innerHTML=`<div class="backup-grid"><div class="card"><h2>💾 수동 백업 · 복원</h2><div class="notice blue">업무 데이터, 최근 작업, 진행상태, 담당자, 센터·가맹점 설정, 차종·부품·단가, 시공내용, 휴지통을 JSON 파일 하나로 백업합니다.</div><div class="actions"><button class="btn primary" onclick="downloadBackup()">💾 지금 백업파일 만들기</button><label class="btn soft file-btn">♻️ 백업파일 선택<input type="file" accept=".json,application/json" style="display:none" onchange="selectRestoreFile(this)"></label></div><div class="notice warn" style="margin-top:12px"><b>사진 파일 자체는 백업파일에 포함되지 않습니다.</b><br>현재 사이트는 완료사진 개수와 폴더명 같은 업무정보만 저장합니다. 실제 사진은 회사 공유폴더에 별도로 보관하세요.</div><div id="restorePreview"></div></div><div class="card"><div class="toolbar"><div><h2>자동백업</h2><div class="small muted">중요한 수정·삭제·완료 처리 직전 상태를 최근 10개까지 보관합니다.</div></div>${autos.length?'<button class="btn danger" onclick="clearAutoBackups()">기록 비우기</button>':''}</div>${autos.length?`<div class="backup-list">${autos.map(b=>`<div class="backup-item"><div class="meta"><b>${esc(b.reason||'자동백업')}</b><span>${esc(formatDateTime(b.createdAt))} · 작업 ${(b.data?.cases||[]).length}건 · 단가 ${(b.data?.rates||[]).length}건</span></div><button class="btn soft" onclick="restoreAutoBackup('${b.id}')">이 상태로 복원</button></div>`).join('')}</div>`:'<div class="empty">아직 자동백업이 없습니다.<br>작업 삭제, 단가 수정, 작업완료 등의 중요한 변경 직전에 자동으로 생성됩니다.</div>'}</div></div>`;
  if(pendingRestoreData)renderRestorePreview();
}
function renderTrash(){purgeExpiredTrash();const rows=(state.trash||[]).slice().sort((a,b)=>String(b.deletedAt||'').localeCompare(String(a.deletedAt||'')));$('#trash').innerHTML=`<div class="card"><div class="toolbar"><div><h2>🗑️ 휴지통</h2><div class="small muted">최근 작업에서 삭제한 업무를 30일간 보관합니다. 필요한 건은 복원할 수 있습니다.</div></div>${rows.length?'<button class="btn danger" onclick="emptyTrash()">휴지통 비우기</button>':''}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>NO.</th><th>삭제일</th><th>센터</th><th>차량번호</th><th>차종</th><th>시공점</th><th>삭제 전 상태</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr class="trash-row"><td>${c.no}</td><td>${esc(formatDateTime(c.deletedAt))}</td><td>${esc(c.center)}</td><td><b>${esc(c.vehicleNo)}</b></td><td>${esc(c.carModel)}</td><td>${esc(c.shop)}</td><td>${esc(c.status)}</td><td><div class="recent-actions"><button class="btn soft" onclick="restoreTrashCase('${c.id}')">복원</button><button class="btn danger" onclick="permanentDeleteTrash('${c.id}')">완전삭제</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">휴지통이 비어 있습니다.</div>'}</div>`}

function render(view){
  ({dashboard:renderDashboard,newcase:renderNewCase,activecases:renderActive,completion:renderCompletion,completedcases:renderCompletedCases,recent:renderRecent,history:renderHistory,master:renderMaster,backup:renderBackup,trash:renderTrash,settings:renderSettings}[view]||renderDashboard)();
}
renderDashboard();
</script>
</body>
</html>
